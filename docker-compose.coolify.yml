# Deploiement autonome : tout le code vit dans les images, seule la donnee
# vit dans le volume `quant_user_data`. Aucun montage de chemin relatif, donc
# aucune dependance a la facon dont l'orchestrateur pose le depot sur disque.
#
# Aucun `networks:` explicite : Compose place tous les services sur le reseau
# par defaut du projet, ce qui suffit a la resolution par nom de service et
# garde le port 8080 du moteur hors de l'hote. Un reseau nomme faisait choisir
# a Traefik une IP qu'il ne pouvait pas joindre, d'ou des `no available server`
# intermittents derriere le proxy Coolify.

x-rack-image: &rack-image
  image: quant-core/rack:local
  build:
    context: .
    dockerfile: Dockerfile.rack

services:
  trading-terminal:
    build:
      context: .
      dockerfile: console/Dockerfile
    container_name: quantapex-ui-terminal
    restart: unless-stopped
    ports:
      - "${CONSOLE_BIND_ADDRESS:-127.0.0.1}:${CONSOLE_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      FREQTRADE_API_URL: http://freqtrade-engine:8080
      FREQTRADE_API_TIMEOUT_MS: ${FREQTRADE_API_TIMEOUT_MS:-3000}
      FREQTRADE_USERNAME: ${FREQTRADE_USERNAME:?FREQTRADE_USERNAME is required}
      FREQTRADE_PASSWORD: ${FREQTRADE_PASSWORD:?FREQTRADE_PASSWORD is required}
      FREQTRADE_ADMIN_USER: ${FREQTRADE_ADMIN_USER:?FREQTRADE_ADMIN_USER is required}
      FREQTRADE_ADMIN_PASSWORD: ${FREQTRADE_ADMIN_PASSWORD:?FREQTRADE_ADMIN_PASSWORD is required}
      FREQTRADE_JWT_SECRET: ${FREQTRADE_JWT_SECRET:?FREQTRADE_JWT_SECRET is required}
      QUANT_RUNTIME_SECRETS_PATH: /app/user_data/private/runtime-secrets.json
      QUANT_RACK_STATE_PATH: /app/user_data/rack/state.json
      QUANT_OBSERVABILITY_SUMMARY_PATH: /app/user_data/observability/summary-168h.json
      RACK_AGENT_URL: http://rack-agent:9191
      RACK_AGENT_TOKEN: ${QUANT_RACK_AGENT_TOKEN:?QUANT_RACK_AGENT_TOKEN is required}
    volumes:
      # La console lit tout user_data mais n'ecrit que dans private/ : c'est
      # ce qui l'empeche de toucher config.json meme si elle est compromise.
      - type: volume
        source: quant_user_data
        target: /app/user_data
        read_only: true
      - type: volume
        source: quant_user_data
        target: /app/user_data/private
        volume:
          subpath: private
    cpus: ${CONSOLE_CPU_LIMIT:-0.5}
    mem_limit: ${CONSOLE_MEMORY_LIMIT:-512m}
    depends_on:
      - freqtrade-engine
      - rack-agent

  freqtrade-engine:
    image: quant-core/engine:local
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: quantapex-freqtrade-core
    restart: unless-stopped
    environment:
      TZ: UTC
      FREQTRADE__API_SERVER__USERNAME: ${FREQTRADE_USERNAME:?FREQTRADE_USERNAME is required}
      FREQTRADE__API_SERVER__PASSWORD: ${FREQTRADE_PASSWORD:?FREQTRADE_PASSWORD is required}
      FREQTRADE__API_SERVER__ENABLED: "true"
      FREQTRADE__API_SERVER__LISTEN_IP_ADDRESS: 0.0.0.0
      FREQTRADE__API_SERVER__LISTEN_PORT: 8080
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${FREQTRADE_API_JWT_SECRET:?FREQTRADE_API_JWT_SECRET is required}
      FREQTRADE__API_SERVER__WS_TOKEN: ${FREQTRADE_WS_TOKEN:?FREQTRADE_WS_TOKEN is required}
      QUANT_RUNTIME_SECRETS_PATH: /freqtrade/user_data/private/runtime-secrets.json
      QUANT_BOOTSTRAP_EXCHANGE_KEY: ${EXCHANGE_API_KEY:-}
      QUANT_BOOTSTRAP_EXCHANGE_SECRET: ${EXCHANGE_API_SECRET:-}
      QUANT_BOOTSTRAP_EXCHANGE_PASSWORD: ${EXCHANGE_API_PASSWORD:-}
      QUANT_BOOTSTRAP_EXCHANGE_UID: ${EXCHANGE_API_UID:-}
      QUANT_BOOTSTRAP_TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      QUANT_BOOTSTRAP_TELEGRAM_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      QUANT_BOOTSTRAP_TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      QUANT_BOOTSTRAP_TELEGRAM_AUTHORIZED_USERS: ${TELEGRAM_AUTHORIZED_USERS:-[]}
    expose:
      - "8080"
    cpus: ${FREQTRADE_CPU_LIMIT:-1.0}
    mem_limit: ${FREQTRADE_MEMORY_LIMIT:-1024m}
    pids_limit: ${FREQTRADE_PIDS_LIMIT:-256}
    volumes:
      - quant_user_data:/freqtrade/user_data

  # Toujours demarre, jamais publie, joignable seulement depuis quant-network.
  # Voir scripts/rack_agent.py pour la raison d'etre de ce pont de privilege.
  rack-agent:
    <<: *rack-image
    container_name: quantapex-rack-agent
    restart: unless-stopped
    environment:
      FREQTRADE_API_URL: http://freqtrade-engine:8080
      FREQTRADE_USERNAME: ${FREQTRADE_USERNAME:?FREQTRADE_USERNAME is required}
      FREQTRADE_PASSWORD: ${FREQTRADE_PASSWORD:?FREQTRADE_PASSWORD is required}
      QUANT_RACK_ACTOR: console-ui
      QUANT_RACK_AGENT_TOKEN: ${QUANT_RACK_AGENT_TOKEN:?QUANT_RACK_AGENT_TOKEN is required}
    expose:
      - "9191"
    cpus: ${RACK_AGENT_CPU_LIMIT:-0.15}
    mem_limit: ${RACK_AGENT_MEMORY_LIMIT:-96m}
    pids_limit: 32
    volumes:
      - quant_user_data:/workspace/user_data
    depends_on:
      - freqtrade-engine

  strategy-lab:
    profiles: ["research"]
    image: quant-core/engine:local
    build:
      context: .
      dockerfile: Dockerfile.engine
    entrypoint: ["/bin/sh"]
    environment:
      TZ: UTC
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    cpus: ${RESEARCH_CPU_LIMIT:-1.0}
    mem_limit: ${RESEARCH_MEMORY_LIMIT:-1024m}
    pids_limit: ${RESEARCH_PIDS_LIMIT:-256}
    volumes:
      - quant_user_data:/freqtrade/user_data

  # FreqAI is deliberately a separate, on-demand research rack. It receives
  # neither execution secrets nor the trading engine's persistent state.
  freqai-lab:
    profiles: ["research"]
    image: quant-core/freqai:local
    build:
      context: .
      dockerfile: Dockerfile.freqai
    entrypoint: ["/bin/sh"]
    environment:
      TZ: UTC
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    cpus: ${FREQAI_CPU_LIMIT:-1.0}
    mem_limit: ${FREQAI_MEMORY_LIMIT:-2048m}
    pids_limit: ${FREQAI_PIDS_LIMIT:-256}
    volumes:
      - quant_freqai_data:/freqtrade/user_data

  # Separate FreqAI execution engine. Disabled unless the ai-execution profile
  # is selected. It starts in dry-run; only the VPS operator may explicitly set
  # FREQAI_EXECUTION_DRY_RUN=false after the model's validation gate.
  freqai-execution:
    profiles: ["ai-execution"]
    image: quant-core/freqai:local
    build:
      context: .
      dockerfile: Dockerfile.freqai
    restart: unless-stopped
    environment:
      TZ: UTC
      QUANT_BOOTSTRAP_CONFIG: quantcore.freqai.dry-run.json
      FREQTRADE__DRY_RUN: ${FREQAI_EXECUTION_DRY_RUN:-true}
      QUANT_RUNTIME_SECRETS_PATH: /freqtrade/user_data/private/runtime-secrets.json
      QUANT_BOOTSTRAP_EXCHANGE_KEY: ${FREQAI_EXCHANGE_API_KEY:-}
      QUANT_BOOTSTRAP_EXCHANGE_SECRET: ${FREQAI_EXCHANGE_API_SECRET:-}
      QUANT_BOOTSTRAP_EXCHANGE_PASSWORD: ${FREQAI_EXCHANGE_API_PASSWORD:-}
      QUANT_BOOTSTRAP_EXCHANGE_UID: ${FREQAI_EXCHANGE_API_UID:-}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    cpus: ${FREQAI_CPU_LIMIT:-1.0}
    mem_limit: ${FREQAI_MEMORY_LIMIT:-2048m}
    pids_limit: ${FREQAI_PIDS_LIMIT:-256}
    volumes:
      - quant_freqai_runtime:/freqtrade/user_data

  rack-operator:
    <<: *rack-image
    profiles: ["operator"]
    entrypoint: ["python3", "/workspace/scripts/rackctl.py"]
    environment:
      FREQTRADE_API_URL: http://freqtrade-engine:8080
      FREQTRADE_USERNAME: ${FREQTRADE_USERNAME:?FREQTRADE_USERNAME is required}
      FREQTRADE_PASSWORD: ${FREQTRADE_PASSWORD:?FREQTRADE_PASSWORD is required}
      QUANT_RACK_ACTOR: ${QUANT_RACK_ACTOR:-coolify-operator}
    cpus: ${RACK_OPERATOR_CPU_LIMIT:-0.25}
    mem_limit: ${RACK_OPERATOR_MEMORY_LIMIT:-128m}
    pids_limit: 64
    volumes:
      - quant_user_data:/workspace/user_data

  rack-observer:
    <<: *rack-image
    profiles: ["observe"]
    entrypoint: ["python3", "/workspace/scripts/observectl.py"]
    environment:
      FREQTRADE_API_URL: http://freqtrade-engine:8080
      FREQTRADE_USERNAME: ${FREQTRADE_USERNAME:?FREQTRADE_USERNAME is required}
      FREQTRADE_PASSWORD: ${FREQTRADE_PASSWORD:?FREQTRADE_PASSWORD is required}
      OBS_CPU_WARN_PCT: ${OBS_CPU_WARN_PCT:-80}
      OBS_RAM_WARN_PCT: ${OBS_RAM_WARN_PCT:-80}
      OBS_EXCHANGE_ERROR_WARN_COUNT: ${OBS_EXCHANGE_ERROR_WARN_COUNT:-3}
    cpus: ${OBSERVER_CPU_LIMIT:-0.10}
    mem_limit: ${OBSERVER_MEMORY_LIMIT:-64m}
    pids_limit: 32
    volumes:
      - quant_user_data:/workspace/user_data

  # Mesure passive du chemin d'execution. Lancee par le planificateur, elle ne
  # passe aucun ordre et n'expose aucun port. Une URL RPC DEX est optionnelle.
  latency-observer:
    <<: *rack-image
    profiles: ["observe"]
    entrypoint: ["python3", "/workspace/scripts/latencyctl.py"]
    environment:
      FREQTRADE_API_URL: http://freqtrade-engine:8080
      FREQTRADE_USERNAME: ${FREQTRADE_USERNAME:?FREQTRADE_USERNAME is required}
      FREQTRADE_PASSWORD: ${FREQTRADE_PASSWORD:?FREQTRADE_PASSWORD is required}
      QUANT_CEX_PROBE_URL: ${QUANT_CEX_PROBE_URL:-https://api.binance.com/api/v3/time}
      QUANT_DEX_RPC_URL: ${QUANT_DEX_RPC_URL:-}
    cpus: ${LATENCY_OBSERVER_CPU_LIMIT:-0.10}
    mem_limit: ${LATENCY_OBSERVER_MEMORY_LIMIT:-64m}
    pids_limit: 32
    volumes:
      - quant_user_data:/workspace/user_data

  rack-preflight:
    <<: *rack-image
    profiles: ["operator"]
    entrypoint:
      - python3
      - /workspace/scripts/preflight.py
      - --process-env
      - --config
      - /workspace/user_data/config.json
      - --runtime-secrets
      - /workspace/user_data/private/runtime-secrets.json
    environment:
      QUANT_RACK_ROOT: /workspace
      FREQTRADE_USERNAME: ${FREQTRADE_USERNAME:?FREQTRADE_USERNAME is required}
      FREQTRADE_PASSWORD: ${FREQTRADE_PASSWORD:?FREQTRADE_PASSWORD is required}
      FREQTRADE_API_JWT_SECRET: ${FREQTRADE_API_JWT_SECRET:?FREQTRADE_API_JWT_SECRET is required}
      FREQTRADE_WS_TOKEN: ${FREQTRADE_WS_TOKEN:?FREQTRADE_WS_TOKEN is required}
      FREQTRADE_ADMIN_USER: ${FREQTRADE_ADMIN_USER:?FREQTRADE_ADMIN_USER is required}
      FREQTRADE_ADMIN_PASSWORD: ${FREQTRADE_ADMIN_PASSWORD:?FREQTRADE_ADMIN_PASSWORD is required}
      FREQTRADE_JWT_SECRET: ${FREQTRADE_JWT_SECRET:?FREQTRADE_JWT_SECRET is required}
      EXCHANGE_API_KEY: ${EXCHANGE_API_KEY:-}
      EXCHANGE_API_SECRET: ${EXCHANGE_API_SECRET:-}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_AUTHORIZED_USERS: ${TELEGRAM_AUTHORIZED_USERS:-[]}
    cpus: 0.10
    mem_limit: 64m
    pids_limit: 32
    volumes:
      - quant_user_data:/workspace/user_data

volumes:
  quant_user_data:
  quant_freqai_data:
  quant_freqai_runtime:
