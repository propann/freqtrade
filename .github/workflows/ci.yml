name: CI

on:
  push:
  pull_request:

jobs:
  core-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lint
        run: |
          python -m compileall scripts strategies
          python scripts/rackctl.py list >/dev/null
      - name: Tests
        run: |
          python -m unittest discover -s tests

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun test console/lib
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
